name: The Automaton Workflow

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 18,6 * * *'

permissions:
  actions: write

jobs:
  authenticate-service-account:
    runs-on: ubuntu-latest
    steps:
    - name: Authenticate to Google (once)
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        create_credentials_file: true

    - name: Upload service account credentials artifact
      uses: actions/upload-artifact@v4
      with:
        name: gcp-credentials
        path: ${{ steps.auth.outputs.credentials_file_path }}

  generate-all-profiles:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install -r scripts/requirements.txt

    - name: Prepare user OAuth token file for scripts
      run: |
        echo '${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}' > token.json

    - name: Run All Profile Generation
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh generate-all
      env:
        CODEFORCES_ID: ${{ secrets.CODEFORCES_ID }}
        LEETCODE_ID: ${{ secrets.LEETCODE_ID }}
        STEAM_ID: ${{ secrets.STEAM_ID }}
        STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        CHESSCOM_ID: ${{ secrets.CHESSCOM_ID }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}

    - name: Upload all profiles artifact
      uses: actions/upload-artifact@v4
      with:
        name: all-profiles-data
        path: Temp/all_profiles.json

  sync-all-profiles:
    runs-on: ubuntu-latest
    needs: [authenticate-service-account, generate-all-profiles]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install -r scripts/requirements.txt

    - name: Download service account credentials
      uses: actions/download-artifact@v4
      with:
        name: gcp-credentials
        path: gcp-creds

    - name: Prepare service account file for scripts
      run: |
        mkdir -p Temp
        cp gcp-creds/*.json Temp/service_account_key.json

    - name: Download all profiles artifact
      uses: actions/download-artifact@v4
      with:
        name: all-profiles-data
        path: Temp

    - name: Run All Profiles Sync
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh sync-all
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

  cleanup-artifacts:
    runs-on: ubuntu-latest
    needs: [sync-all-profiles]
    if: always()
    steps:
    - name: Remove all artifacts
      uses: c-hive/gha-remove-artifacts@v1
      with:
        age: '0' 
        skip-recent: '0'