name: The Automaton Workflow

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 18,6 * * *'

permissions:
  actions: write

jobs:
  authenticate-service-account:
    runs-on: ubuntu-latest
    steps:
    - name: Authenticate to Google (once)
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        create_credentials_file: true

    - name: Upload service account credentials artifact
      uses: actions/upload-artifact@v4
      with:
        name: gcp-credentials
        path: ${{ steps.auth.outputs.credentials_file_path }}

  generate-codeforces:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: pip install -r scripts/requirements.txt
    - name: Run Codeforces Generation
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh generate-codeforces
      env:
        CODEFORCES_ID: ${{ secrets.CODEFORCES_ID }}
    - name: Upload Codeforces profile artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeforces-profile
        path: Temp/codeforces_profile.json

  generate-leetcode:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: pip install -r scripts/requirements.txt
    - name: Run LeetCode Generation
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh generate-leetcode
      env:
        LEETCODE_ID: ${{ secrets.LEETCODE_ID }}
    - name: Upload LeetCode profile artifact
      uses: actions/upload-artifact@v4
      with:
        name: leetcode-profile
        path: Temp/leetcode_profile.json

  generate-steam:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: pip install -r scripts/requirements.txt
    - name: Run Steam Generation
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh generate-steam
      env:
        STEAM_ID: ${{ secrets.STEAM_ID }}
        STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
    - name: Upload Steam profile artifact
      uses: actions/upload-artifact@v4
      with:
        name: steam-profile
        path: Temp/steam_profile.json

  generate-youtube:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: pip install -r scripts/requirements.txt
    - name: Prepare user OAuth token file for scripts
      run: |
        echo '${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}' > token.json
    - name: Run YouTube Generation
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh generate-youtube
      env:
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
        GOOGLE_AUTH_URI: ${{ secrets.GOOGLE_AUTH_URI }}
        GOOGLE_TOKEN_URI: ${{ secrets.GOOGLE_TOKEN_URI }}
        GOOGLE_AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.GOOGLE_AUTH_PROVIDER_X509_CERT_URL }}
        GOOGLE_REDIRECT_URIS: ${{ secrets.GOOGLE_REDIRECT_URIS }}
    - name: Upload YouTube profile artifact
      uses: actions/upload-artifact@v4
      with:
        name: youtube-profile
        path: Temp/youtube_profile.json

  generate-chesscom:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: pip install -r scripts/requirements.txt
    - name: Run Chess.com Generation
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh generate-chesscom
      env:
        CHESSCOM_ID: ${{ secrets.CHESSCOM_ID }}
    - name: Upload Chess.com profile artifact
      uses: actions/upload-artifact@v4
      with:
        name: chesscom-profile
        path: Temp/chesscom_profile.json

  sync-codeforces:
    runs-on: ubuntu-latest
    needs: [authenticate-service-account, generate-codeforces]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: pip install -r scripts/requirements.txt
    - name: Download service account credentials
      uses: actions/download-artifact@v4
      with:
        name: gcp-credentials
        path: gcp-creds
    - name: Prepare service account file for scripts
      run: |
        mkdir -p Temp
        cp gcp-creds/*.json Temp/service_account_key.json
    - name: Download Codeforces profile artifact
      uses: actions/download-artifact@v4
      with:
        name: codeforces-profile
        path: Temp
    - name: Run Codeforces Sync
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh sync-codeforces
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

  sync-leetcode:
    runs-on: ubuntu-latest
    needs: [authenticate-service-account, generate-leetcode]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: pip install -r scripts/requirements.txt
    - name: Download service account credentials
      uses: actions/download-artifact@v4
      with:
        name: gcp-credentials
        path: gcp-creds
    - name: Prepare service account file for scripts
      run: |
        mkdir -p Temp
        cp gcp-creds/*.json Temp/service_account_key.json
    - name: Download LeetCode profile artifact
      uses: actions/download-artifact@v4
      with:
        name: leetcode-profile
        path: Temp
    - name: Run LeetCode Sync
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh sync-leetcode
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

  sync-steam:
    runs-on: ubuntu-latest
    needs: [authenticate-service-account, generate-steam]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: pip install -r scripts/requirements.txt
    - name: Download service account credentials
      uses: actions/download-artifact@v4
      with:
        name: gcp-credentials
        path: gcp-creds
    - name: Prepare service account file for scripts
      run: |
        mkdir -p Temp
        cp gcp-creds/*.json Temp/service_account_key.json
    - name: Download Steam profile artifact
      uses: actions/download-artifact@v4
      with:
        name: steam-profile
        path: Temp
    - name: Run Steam Sync
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh sync-steam
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

  sync-youtube:
    runs-on: ubuntu-latest
    needs: [authenticate-service-account, generate-youtube]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: pip install -r scripts/requirements.txt
    - name: Download service account credentials
      uses: actions/download-artifact@v4
      with:
        name: gcp-credentials
        path: gcp-creds
    - name: Prepare service account file for scripts
      run: |
        mkdir -p Temp
        cp gcp-creds/*.json Temp/service_account_key.json
    - name: Download YouTube profile artifact
      uses: actions/download-artifact@v4
      with:
        name: youtube-profile
        path: Temp
    - name: Run YouTube Sync
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh sync-youtube
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

  sync-chesscom:
    runs-on: ubuntu-latest
    needs: [authenticate-service-account, generate-chesscom]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: pip install -r scripts/requirements.txt
    - name: Download service account credentials
      uses: actions/download-artifact@v4
      with:
        name: gcp-credentials
        path: gcp-creds
    - name: Prepare service account file for scripts
      run: |
        mkdir -p Temp
        cp gcp-creds/*.json Temp/service_account_key.json
    - name: Download Chess.com profile artifact
      uses: actions/download-artifact@v4
      with:
        name: chesscom-profile
        path: Temp
    - name: Run Chess.com Sync
      run: |
        chmod +x scripts/workflow.sh
        ./scripts/workflow.sh sync-chesscom
      env:
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

  cleanup-artifacts:
    runs-on: ubuntu-latest
    needs: [sync-codeforces, sync-leetcode, sync-steam, sync-youtube, sync-chesscom]
    if: always()
    steps:
    - name: Remove all artifacts
      uses: c-hive/gha-remove-artifacts@v1
      with:
        age: '0' 
        skip-recent: '0'